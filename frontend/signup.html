<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account - Books For All</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
</head>
<body>
  <header id="nav"></header>
  <script>Nav.render("login");</script>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Create account</h1>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="full_name">Name</label>
          <input class="input" id="full_name" name="full_name" type="text" placeholder="Enter your full name" autocomplete="name" maxlength="120" required>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" maxlength="30" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <input class="input" id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter your password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-block" id="signupBtn" type="submit">Sign up</button>
        <p id="signupMsg" class="form-msg error" role="alert" hidden></p>
      </form>
      <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="footer">© 2026 BooksForAll. All rights reserved.</footer>
  <script src="js/signup.js"></script>
</body>
</html>
