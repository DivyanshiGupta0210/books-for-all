<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Books For All</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
</head>
<body>
  <header id="nav"></header>
  <script>Nav.render("login");</script>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome</h1>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="identifier">Username or Email</label>
          <input class="input" id="identifier" name="identifier" type="text" placeholder="Enter your username or email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Login</button>
        <p id="loginMsg" class="form-msg error" role="alert" hidden></p>
      </form>
      <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <footer class="footer">© 2026 BooksForAll. All rights reserved.</footer>
  <script src="js/login.js"></script>
</body>
</html>
