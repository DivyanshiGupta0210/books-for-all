<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore - Books For All</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/books.js"></script>
</head>
<body>
  <header id="nav"></header>
  <script>Nav.render("app", "explore");</script>

  <main class="container page">
    <div class="search-row">
      <input class="input" id="searchInput" type="search" placeholder="Search for books by title or author name" aria-label="Search for books by title or author name" autocomplete="off">
    </div>

    <div class="filters">
      <select class="select" id="genreFilter" aria-label="Genre"><option value="">Genre</option></select>
      <select class="select" id="typeFilter" aria-label="Book Type"><option value="">Book Type</option></select>
      <select class="select" id="languageFilter" aria-label="Language"><option value="">Language</option></select>
      <button type="button" class="link-btn" id="clearFilters" hidden>Clear all</button>
    </div>

    <div id="browse">
      <section class="explore-block" aria-labelledby="featuredTitle">
        <h2 class="h-section" id="featuredTitle">Featured Books</h2>
        <div class="scroller" id="featuredRow"></div>
      </section>

      <section class="explore-block" aria-labelledby="newTitle">
        <h2 class="h-section" id="newTitle">New Arrivals</h2>
        <div class="grid-4" id="newGrid"></div>
      </section>
    </div>

    <section class="explore-block" id="resultsSection" aria-live="polite" hidden>
      <h2 class="h-section" id="resultsTitle">Search Results</h2>
      <div class="results" id="results"></div>
    </section>
  </main>

  <footer class="footer">© 2026 BooksForAll. All rights reserved.</footer>
  <script src="js/explore.js"></script>
</body>
</html>
