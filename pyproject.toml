[project]
name = "books-for-all"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "bcrypt",
    "python-multipart",
    "email-validator",
]

[tool.vercel]
entrypoint = "backend.main:app"
